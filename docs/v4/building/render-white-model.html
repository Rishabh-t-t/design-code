// ---------- dimensions ----------

}
function trees() {

// ---------- tower parts ----------

}
function coreShaft(k, mat = M.rawconc) { const y = k === 0 ? PL : fy(k) - 0.35; box(CX1 - CX0, k === 0 ? G - PL : FH, CZ1 - CZ0, (CX0 + CX1) / 2, y, (CZ0 + CZ1) / 2, mat); }

// a wall with punched windows. ax 'x' runs along x at z = c; ax 'z' runs along z at x = c. n = outward sign.

}
// back-left block rises one storey above the roof
const KX0 = TX0, KX1 = -2.5, KZ0 = TZ0, KZ1 = -4;
function topBlock(state) { // 'skel' | 'walls' | 'done'

  if (state === 'skel') { for (const x of [KX0, -4.5, KX1 - 0.5]) for (const z of [KZ0, KZ1 - 0.5]) box(0.5, FH - 0.35, 0.5, x, y, z, M.rawconc); box(KX1 - KX0, 0.35, KZ1 - KZ0, (KX0 + KX1) / 2, TOP + FH - 0.35, (KZ0 + KZ1) / 2, M.rawconc); return; }

  box(2.4, 1.4, 2, -1.2, TOP + FH + 0.15, -7.2, M.metal); cyl(0.7, 0.15, -1.2, TOP + FH + 1.55, -7.2, M.frame, 20);
}
function podiumFinished(f) {
  const y = PL, h = G - 0.35 - PL;
  box(PX1 - PX0 - 0.6, h, 0.06, (PX0 + PX1) / 2, y, PZ1 - 0.4, M.glass);                      // south glazing
  box(0.06, h, PZ1 - PZ0 - 0.6, PX1 - 0.4, y, (PZ0 + PZ1) / 2, M.glass);                      // east glazing

  box(0.14, 0.12, PZ1 - PZ0 - 0.6, PX1 - 0.36, y + 2.0, (PZ0 + PZ1) / 2, M.frame, { cast: false });
  box(PX1 - PX0 + 0.2, 0.75, PZ1 - PZ0 + 0.2, (PX0 + PX1) / 2, G - 0.75, (PZ0 + PZ1) / 2, M.white);   // fascia
  box(0.4, h, PZ1 - PZ0, PX0 + 0.2, y, (PZ0 + PZ1) / 2, M.white); box(PX1 - PX0, h, 0.4, (PX0 + PX1) / 2, y, PZ0 + 0.2, M.white);

  box(2.6, 0.22, 4.2, PX1 + 1.2, G - 1.9, 3.4, M.white); box(0.12, G - 1.9 - PL, 0.12, PX1 + 2.3, PL, 1.5, M.frame); box(0.12, G - 1.9 - PL, 0.12, PX1 + 2.3, PL, 5.3, M.frame);
}
function scaffold(k) {
  const y = fy(k), segs = [], zf = TZ1 + 1, xf = CX1 + 0.8;
  for (let x = TX0 - 0.8; x <= TX1 + 0.8; x += 2) segs.push([[x, y, zf], [x, y + FH + 1, zf]]);
  for (let z = TZ0 - 0.8; z <= TZ1 + 1; z += 2) segs.push([[xf, y, z], [xf, y + FH + 1, z]]);

}
function cables() {
  tube([[17.5, 0.3, -6], [12, 0.3, -4.5], [8.5, 0.6, -4.5]], 0.32, M.cableG);
  tube([[-15, 0.3, 4], [-11, 0.3, 5], [-8.5, 0.6, 5]], 0.32, M.cableB);
  tube([[8.45, 0.6, -4.5], [8.45, TOP, -4.5]], 0.26, M.cableG); tube([[8.45, 0.6, 4.6], [8.45, TOP, 4.6]], 0.22, M.cableB);

  for (let k = 1; k <= NF; k++) { tube([[-7.4, fy(k) + 2.9, 5.2], [0, fy(k) + 2.9, 5.2], [7.4, fy(k) + 2.9, 5.2]], 0.11, k % 2 ? M.cableB : M.cableG); tube([[7.4, fy(k) + 2.9, 5.2], [7.4, fy(k) + 2.9, -9]], 0.11, k % 2 ? M.cableG : M.cableB); }
}

// ---------- stages ----------
function skeleton(n) { // podium frame + n floors of columns and slabs
  columns(0); coreShaft(0);
  for (let k = 1; k <= Math.min(n, NF); k++) { slab(k); columns(k); coreShaft(k); }
  if (n >= 9) { slab(NF + 1); topBlock('skel'); }
}
function buildStage(s) {
  scene = new THREE.Scene(); scene.environment = envTex;
  scene.add(new THREE.HemisphereLight(0xffffff, 0xc9c6c0, 0.42));
  const sun = new THREE.DirectionalLight(0xfffaf2, 2.5);
  sun.position.set(-40, 75, 45); sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
  Object.assign(sun.shadow.camera, { left: -45, right: 45, top: 45, bottom: -45, near: 1, far: 220 });
  sun.shadow.radius = 9; sun.shadow.blurSamples = 20; sun.shadow.bias = -0.0003; scene.add(sun);
  const fill = new THREE.DirectionalLight(0xf3f5ff, 0.35); fill.position.set(60, 30, 20); fill.intensity = 0.12; scene.add(fill);
  const sc = new THREE.Mesh(new THREE.PlaneGeometry(400, 400), new THREE.ShadowMaterial({ opacity: 0.16 })); sc.rotation.x = -Math.PI / 2; sc.position.y = -0.61; sc.receiveShadow = true; scene.add(sc);

  const [kind, n] = s.split(':'); const v = +n || 0;

    if (wv >= NF) topBlock('walls');

    carport(kind === 'wire'); batteryYard(kind === 'wire');
    if (kind === 'wire') { cables(); trees(); }

  }

    site(true); plinth(v >= NF); columns(0); coreShaft(0); roofFinished(); topBlock('done');
    for (let k = 1; k <= NF; k++) { slab(k, k > NF - v ? M.white : M.rawconc); columns(k); interiorWalls(k, M.white);
      if (k > NF - v) { floorWalls(k, M.white, M.glass); bands(k); balcony(k); } else { floorWalls(k, M.block, null); coreShaft(k); } }
    slab(NF + 1, M.white);
    if (v >= NF) { coreFinished(); podiumFinished(); } else { for (let k = NF - v + 1; k <= NF; k++) coreShaft(k, M.white); }

    return;
  }

    site(true); plinth(true); columns(0); roofFinished(); topBlock('done'); coreFinished(); podiumFinished();
    for (let k = 1; k <= NF; k++) { slab(k, M.white); interiorWalls(k, M.white); floorWalls(k, M.white, M.glass, kind === 'live' && k === 6); bands(k); balcony(k); }

  }
}
function planLines(alpha = 1, onlyTower = false) {
  const segs = [];
  if (!onlyTower) {
    segs.push(...rectLines(-30, -23, 30, 23));
    segs.push(...rectLines(-28, 0, -14, 18)); for (let z = 3; z < 18; z += 3) segs.push([[-27, 0.02, z], [-15, 0.02, z]]);
    segs.push(...rectLines(12, -18, 29, -3)); [[13, -16], [13, -11.5], [13, -7]].forEach(([x, z]) => segs.push(...rectLines(x, z, x + 9, z + 3))); segs.push(...rectLines(23, -17.5, 27, -12.5));
    const circle = (cx, cz, r) => { for (let i = 0; i < 16; i++) { const a = i / 16 * Math.PI * 2, b = (i + 1) / 16 * Math.PI * 2; segs.push([[cx + r * Math.cos(a), 0.02, cz + r * Math.sin(a)], [cx + r * Math.cos(b), 0.02, cz + r * Math.sin(b)]]); } };
    [[-25, -17, 2.2], [-19, -9, 1.9], [-26, -8, 2], [16, 16, 2.4], [23, 18, 2], [27, 9, 1.9], [11, 16, 2], [-6, 17, 1.7], [-12, 15, 1.9]].forEach(([x, z, r]) => circle(x, z, r));
    segs.push([[TX0, 0.02, PZ1 + 3], [TX1, 0.02, PZ1 + 3]], [[TX0, 0.02, PZ1 + 2.4], [TX0, 0.02, PZ1 + 3.6]], [[TX1, 0.02, PZ1 + 2.4], [TX1, 0.02, PZ1 + 3.6]]);
    segs.push([[PX0 - 3, 0.02, TZ0], [PX0 - 3, 0.02, TZ1]], [[PX0 - 3.6, 0.02, TZ0], [PX0 - 2.4, 0.02, TZ0]], [[PX0 - 3.6, 0.02, TZ1], [PX0 - 2.4, 0.02, TZ1]]);
  }
  segs.push(...rectLines(PX0 - 1.3, PZ0 - 1.3, PX1 + 1.3, PZ1 + 1.3));                       // plinth
  segs.push(...rectLines(PX0, PZ0, PX1, PZ1));                                                // podium
  segs.push(...rectLines(TX0, TZ0, TX1, TZ1), ...rectLines(TX0 + 0.3, TZ0 + 0.3, TX1 - 0.3, TZ1 - 0.3)); // tower
  segs.push(...rectLines(CX0, CZ0, CX1, CZ1)); for (let i = 0; i < 6; i++) segs.push([[CX0 + 0.2, 0.02, CZ0 + 0.4 + i * 0.6], [CX1 - 0.2, 0.02, CZ0 + 0.4 + i * 0.6]]);
  segs.push([[TX0, 0.02, BZ], [BX, 0.02, BZ]], [[BX, 0.02, BZ], [BX, 0.02, TZ1]]);              // balcony bay
  segs.push(...rectLines(KX0, KZ0, KX1, KZ1));
  segs.push([[-3, 0.02, -10], [-3, 0.02, -1]], [[-2, 0.02, 0.5], [7, 0.02, 0.5]], [[4, 0.02, -10], [4, 0.02, -5]]);
  for (const x of COLX) for (const z of COLZ) segs.push(...rectLines(x, z, x + 0.5, z + 0.5));
  for (const [x, z] of [[-3, -3], [2, 0.5]]) for (let i = 0; i < 6; i++) { const a = i / 6 * Math.PI / 2, b = (i + 1) / 6 * Math.PI / 2; segs.push([[x + 1.2 * Math.cos(a), 0.02, z + 1.2 * Math.sin(a)], [x + 1.2 * Math.cos(b), 0.02, z + 1.2 * Math.sin(b)]]); }
  return lines(segs, alpha < 1 ? M.lineSoft : M.line);
}

// ---------- camera (unchanged, so the UI keeps its layout) ----------
function camera(t) {
  const cam = new THREE.PerspectiveCamera(18, W / H, 1, 1000);
  const dist = THREE.MathUtils.lerp(185, 205, t), elev = THREE.MathUtils.lerp(89.5, 30, t) * Math.PI / 180, az = THREE.MathUtils.lerp(0, 38, t) * Math.PI / 180;
  const tgt = new THREE.Vector3(THREE.MathUtils.lerp(0, 1, t), THREE.MathUtils.lerp(0, 13, t), THREE.MathUtils.lerp(0, -1, t));
  cam.position.set(tgt.x + dist * Math.cos(elev) * Math.sin(az), tgt.y + dist * Math.sin(elev), tgt.z + dist * Math.cos(elev) * Math.cos(az));
  cam.up.set(0, 1, 0); if (t === 0) cam.up.set(0, 0, -1); cam.lookAt(tgt); return cam;
}
window.renderStage = (s, t = 1) => { buildStage(s); renderer.render(scene, camera(t)); return renderer.domElement.toDataURL('image/png'); };
window.renderAO = (s, t = 1, radius = 1.6, scale = 1.0) => {

  const tm = renderer.toneMapping; renderer.toneMapping = THREE.NoToneMapping; renderer.setClearColor(0xffffff, 1);
  pass.render(renderer, null, null);

  renderer.toneMapping = tm; renderer.setClearColor(0x000000, 0); pass.dispose(); return url;
};
window.proj = (x, y, z) => { const c = camera(1); c.updateMatrixWorld(); const p = new THREE.Vector3(x, y, z).project(c); return [(p.x + 1) / 2, (1 - p.y) / 2]; };
window.ready = true;
